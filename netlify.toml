[build]
command = "hugo"
publish = "public"

[build.environment]
HUGO_VERSION = "0.157.0"

[[redirects]]
  from = "/general/msc_transcript_htunteza.pdf"
  to = "/general/msc-transcript/"
  status = 301
  force = true

[[redirects]]
  from = "/general/bds_transcript_htunteza.pdf"
  to = "/general/bds-transcript/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://api.openalex.org https://api.unsplash.com https://doi.org https://graphql.anilist.co https://ws.audioscrobbler.com https://gc.zgo.at https://stats.htunteza.com; frame-src 'self'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/theme/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/general/cv/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/general/msc_transcript_htunteza.pdf"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/general/bds_transcript_htunteza.pdf"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/general/documents/d6e5609a2d5acdbcd5627a56cdb2ea50.pdf"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/general/documents/7bc4ddb932d5a4c51da057b82c090cc7.pdf"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, noarchive, nosnippet"
