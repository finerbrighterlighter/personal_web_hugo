baseURL = "https://htunteza.com"
languageCode = "en-us"
title = "Htun Teza"

[params]
author = "Htun Teza"
description = "Htun Teza is a Burmese Data Scientist, Research Assistant and Dentist: currently based in Bangkok Thailand."
animateStyle = "animate-fade-up"
ogImage = "assets/general/og_image.webp"
promptName = "hteza"
promptHost = "homepage"
buildFuture = true
cacheTTLMinutes = 60
researchTagLimit = 10

[[params.navlinks]]
name = "Home"
url = "/"
host = "homepage"

[[params.navlinks]]
name = "Works"
url = "/works/"
host = "academia"

[[params.navlinks]]
name = "Posts"
url = "/posts/"
host = "notebook"

[[params.navlinks]]
name = "Blood"
url = "/blood/"
host = "rhesus"

[[params.navlinks]]
name = "About"
url = "/about/"
host = "biography"
hidden = true

[outputFormats.llmstxt]
  mediaType      = "text/plain"
  baseName       = "llms"
  isPlainText    = true
  notAlternative = true

[outputs]
  home = ["HTML", "llmstxt"]

[taxonomies]

[security]
enableInlineShortcodes = false

[security.funcs]
getenv = ["^HUGO_"]
