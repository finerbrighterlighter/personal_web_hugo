baseURL = "https://htunteza.com"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages.en]
  locale = "en-us"
  weight = 1
  title = "Htun Teza"

  [languages.en.outputs]
    home = ["HTML", "llmstxt", "llmsfull"]

  [languages.en.params]
    description = "Htun Teza is a Burmese Data Scientist, Research Assistant and Dentist: currently based in Bangkok Thailand."

[languages.mm]
  locale = "my"
  weight = 2
  title = "ထွန်းတေဇာ"

  [languages.mm.outputs]
    home = ["HTML"]

  [languages.mm.params]
    description = "ထွန်းတေဇာ မြန်မာလူမျိုး ဒေတာသိပ္ပံပညာရှင်၊ သုတေသီနှင့် သွားဘက်ဆိုင်ရာဆရာဝန်တစ်ဦးဖြစ်ပြီး ထိုင်းနိုင်ငံ ဘန်ကောက်မြို့တွင် တာဝန်ထမ်းဆောင်လျက်ရှိသည်။"

[params]
author = "Htun Teza"
animateStyle = "animate-fade-up"
ogImage = "assets/general/og_image.webp"
promptName = "hteza"
promptHost = "homepage"
buildFuture = true
cacheTTLMinutes = 60
researchTagLimit = 5

[[params.navlinks]]
name = "Home"
url = "/"
host = "homepage"

[[params.navlinks]]
name = "Works"
url = "/works/"
host = "academia"

[[params.navlinks]]
name = "Posts"
url = "/posts/"
host = "notebook"

[[params.navlinks]]
name = "Blood"
url = "/blood/"
host = "rhesus"

[[params.navlinks]]
name = "About"
url = "/about/"
host = "biography"
hidden = true

[outputFormats.llmstxt]
  mediaType      = "text/plain"
  baseName       = "llms"
  isPlainText    = true
  notAlternative = true

[outputFormats.llmsfull]
  mediaType      = "text/plain"
  baseName       = "llms-full"
  isPlainText    = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"]]
          inline = [["$", "$"]]

[taxonomies]

[security]
enableInlineShortcodes = false

[security.funcs]
getenv = ["^HUGO_"]
