{{ define "main" }}
<article class="post-single">

  <h1>{{ .Title }}</h1>

  <p class="post-meta">
    {{ with .Params.company }}<span class="post-company">{{ . }}</span>{{ end }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
  </p>

  {{ .Content }}

</article>
{{ end }}
