<!-- ============================= -->

<!-- PAGE TITLE -->

<!-- ============================= -->

<title>
{{ if .IsHome }}
{{ .Site.Title }}
{{ else }}
{{ .Title }} | {{ .Site.Title }}
{{ end }}
</title>

<!-- ============================= -->

<!-- BASIC META -->

<!-- ============================= -->

<meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="Htun Teza">
{{ if eq .Params.private true }}
<meta name="robots" content="noindex, nofollow">
{{ else }}
<meta name="robots" content="index, follow">
{{ end }}
<link rel="canonical" href="{{ .Permalink }}">

<!-- ============================= -->

<!-- OPEN GRAPH (SOCIAL SHARING) -->

<!-- ============================= -->

<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "assets/general/og_image.webp" | absURL }}">

<!-- ============================= -->

<!-- TWITTER CARD -->

<!-- ============================= -->

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="twitter:image" content="{{ "assets/general/og_image.webp" | absURL }}">

<!-- ============================= -->

<!-- RSS FEED -->

<!-- ============================= -->

{{ with .OutputFormats.Get "RSS" }}

<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}">
{{ end }}
