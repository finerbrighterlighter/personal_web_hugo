<div class="terminal-window panel" role="region" aria-label="Anime and manga">

  <div class="window-header">
    <div class="window-controls" aria-hidden="true">
      <span class="control close"></span>
      <span class="control minimize"></span>
      <span class="control maximize"></span>
    </div>
    <div class="window-title">otaku.sh</div>
  </div>

  <div class="window-content">

    {{- /* Two strips, one AniList request (anilist.js): most recently updated manga, then anime — any status except planning. */ -}}
    <pre class="panel-terminal"><a href="https://anilist.co/user/finer/mangalist" target="_blank" rel="noreferrer noopener">$ anilist manga --sort=updated</a></pre>

    <div id="last-read-manga" class="album-strip" aria-live="polite"></div>

    <pre class="panel-terminal panel-terminal-gap"><a href="https://anilist.co/user/finer/animelist" target="_blank" rel="noreferrer noopener">$ anilist anime --sort=updated</a></pre>

    <div id="last-watched-anime" class="album-strip" aria-live="polite"></div>

  </div>

</div>
