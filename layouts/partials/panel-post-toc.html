{{ if and .IsPage (eq .Section "posts") }}
{{ $sectionHeadings := findRE `<h[2-6][^>]*id=` .Content }}
{{ if ge (len $sectionHeadings) 2 }}
<aside class="terminal-window panel post-toc-panel" aria-label="Table of contents">
  <div class="window-header">
    <div class="window-controls" aria-hidden="true">
      <span class="control close"></span>
      <span class="control minimize"></span>
      <span class="control maximize"></span>
    </div>
    <div class="window-title">toc.sh</div>
  </div>
  <div class="window-content">
    <nav class="post-toc" aria-label="Table of contents">
      <pre class="panel-terminal post-toc-command">$ toc --levels=<span class="post-toc-current-level">1</span></pre>
      <div class="post-toc-controls">
        <fieldset class="post-toc-level-switch">
          <legend class="post-toc-level-legend">Levels</legend>
          <input type="radio" name="post-toc-level" id="post-toc-level-1" value="1" checked>
          <label class="post-toc-level-option" for="post-toc-level-1">1</label>
          <input type="radio" name="post-toc-level" id="post-toc-level-2" value="2">
          <label class="post-toc-level-option post-toc-level-option-secondary" for="post-toc-level-2">2</label>
        </fieldset>
      </div>
      {{ .TableOfContents }}
    </nav>
  </div>
</aside>
{{- /* Level-switch logic lives in static/js/post_toc.js (module, runs after parse). */ -}}
<script type="module" src="{{ "js/post_toc.js" | relURL }}"></script>
{{ end }}
{{ end }}
