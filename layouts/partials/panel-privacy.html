<div class="terminal-window panel">
    <div class="window-header">
      <div class="window-controls" aria-hidden="true">
        <span class="control close"></span>
        <span class="control minimize"></span>
        <span class="control maximize"></span>
      </div>
      <div class="window-title">privacy.sh</div>
    </div>

    <div class="window-content">

      <div class="panel-terminal"><a href="https://stats.htunteza.com">$ goatcounter --privacy</a></div>

      <div class="privacy-info">
        <div>[✓] privacy-focused analytics</div>
        <div>[✓] no advertising cookies</div>
        <div>[✓] no cross-site tracking</div>
        <div>[✓] no personal profiling</div>

        <div>
          docs →
          <a href="https://www.goatcounter.com/help/privacy">[Privacy]</a>
          <a href="https://www.goatcounter.com/help/gdpr">[GDPR]</a>
        </div>
      </div>

      <div class="panel-terminal">$ cache --info</div>
      <div class="privacy-info">
        <div>[include] themes, api calls</div>
        <div id="cache-expire-line">[expires] {{ site.Params.cacheTTLMinutes | default 60 }} minutes</div>
        <div>flush → <span id="cache-flush-btns"><button id="cache-clear-btn">[Now]</button> <button id="cache-slow-btn">[In 10s]</button></span></div>
      </div>

    </div>
  </div>
