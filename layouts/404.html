{{ define "main" }}
{{ $fallback := "images/404/http-cat-404.jpeg" | absURL }}

<h2 style="border-bottom: 1px solid #555; margin-top: 3rem;">404 — This page wandered off</h2>
<p>The server looked. The cat looked. Nobody found it.</p>

<img 
  src="https://http.cat/404"
  alt="HTTP 404 Cat"
  style="max-width: 100%; height: auto;"
  onerror='this.onerror=null; this.src="{{ $fallback }}"; this.alt="Local fallback image";'>
<p>
  <a href="{{ "/" | absURL }}">Return to the home page</a>.
</p>
{{ end }}
