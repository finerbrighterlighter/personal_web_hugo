<div class="image-grid">
    {{ $match := .Get "match" | default "*" }}
    {{ range .Page.Resources.Match $match }}
        {{ $res := . }}
        {{ $display := $res }}
        {{ if gt $res.Width 2000 }}
            {{ $display = $res.Resize "2000x" }}
        {{ end }}
        {{ $webp := $display.Process "webp" }}

        <a href="{{ $res.RelPermalink }}" target="_blank" rel="noreferrer noopener">
            <picture>
                <source type="image/webp" srcset="{{ $webp.RelPermalink }}">
                <img src="{{ $display.RelPermalink }}"
                     class="img-responsive"
                     loading="lazy"
                     decoding="async"
                     width="{{ $display.Width }}"
                     height="{{ $display.Height }}"
                     alt="{{ $res.Name }}">
            </picture>
        </a>
    {{ end }}
</div>
